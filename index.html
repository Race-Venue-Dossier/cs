function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function b64(a){var s='';a=new Uint8Array(a);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function open_(raw){
  return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(E.i)},k,u8(E.c))})
    .then(function(pt){return new TextDecoder().decode(pt)});
}
function show(h){
  // replace the login page only once it has finished loading: document.open() while the login page is still
  // loading (fast automatic sign-in) would append the page to the login form instead of replacing it
  // the page is put in as a fresh document tree (no document.write: in a document rewritten with
  // document.write Chrome stops sending pointerleave, so chart tooltips stayed on screen)
  var go=function(){setTimeout(function(){
    var doc=new DOMParser().parseFromString(h,'text/html');
    document.replaceChild(document.importNode(doc.documentElement,true),document.documentElement);
    // imported scripts do not run: replace each by a new script element (inline scripts run at once, in order)
    Array.prototype.forEach.call(document.querySelectorAll('script'),function(o){
      var n=document.createElement('script');
      for(var i=0;i<o.attributes.length;i++)n.setAttribute(o.attributes[i].name,o.attributes[i].value);
      n.text=o.text;o.parentNode.replaceChild(n,o);
    });
    window.scrollTo(0,0);
  },0)};
  if(document.readyState==='complete')go();else window.addEventListener('load',go,{once:true});
}
function derive(pw){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits'])
    .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:u8(E.s),iterations:E.n,hash:'SHA-256'},k,256)});
}

  if(saved)open_(u8(saved)).then(show).catch(function(){try{localStorage.removeItem(KEY)}catch(e){}});

f.addEventListener('submit',function(ev){
  ev.preventDefault();err.textContent='';go.disabled=true;go.textContent='Opening…';
  var raw;
  var rem=document.getElementById('rem').checked;
  derive(document.getElementById('pw').value).then(function(r){raw=r;return open_(r)}).then(function(h){
